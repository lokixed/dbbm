name: Release

# On a version tag (v1.2.3): test-scan the image, then publish it to GitHub Container Registry and
# Docker Hub, sign it, and create the GitHub release.
#
# One-time setup (repository Settings > Secrets and variables > Actions):
#   variable DOCKERHUB_USERNAME  Docker Hub user or organisation that owns the repository
#   secret   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to ghcr.io
  id-token: write # keyless image signing
  attestations: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/dbbm

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the application version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/app/version.py)"
          if [ "$tag" != "$app" ]; then echo "Tag $tag does not match backend/app/version.py ($app)" >&2; exit 1; fi
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $tag" >&2; exit 1; }

      - name: Docker Hub is configured
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret" >&2; exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Scan before anything is published: a vulnerable image never reaches a registry.
      - name: Build the image for scanning (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dbbm:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dbbm:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true # SBOM attached to the image
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4
      - name: Sign the image (keyless)
        run: |
          cosign sign --yes "${GHCR_IMAGE}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "${DOCKERHUB_IMAGE}@${{ steps.build.outputs.digest }}"

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          append_body: true
          body: |
            ## Docker image

            ```
            docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
            docker pull ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}
            ```
          prerelease: ${{ contains(github.ref_name, '-') }}
