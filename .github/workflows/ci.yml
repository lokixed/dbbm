name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release exactly this version (X.Y.Z). Needed for the first stable release."
        required: false
        default: ""
      bump:
        description: "Force a bump instead of reading the commit log"
        type: choice
        options: [auto, major, minor, patch]
        default: auto

# Read-only by default; the release job asks for more.
permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung test must fail fast, not run for the 6 h default
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # The Google Drive adapter is tested against the real rclone (local backend standing in
      # for Drive) and a fake rclone for Drive-only failures. CI never talks to Google.
      - name: Install pinned rclone
        run: sudo sh ../scripts/install-rclone.sh /usr/local/bin
      - run: pytest -m "not integration"
      - name: Detect Docker
        id: docker
        run: |
          if docker info >/dev/null 2>&1; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      # The MySQL/PostgreSQL/MongoDB backup round trips skip themselves here (no client tools on PATH);
      # they run in the `docker` job below, inside the application image. Firestore is covered by
      # the unit tests with a fake Google REST service; CI never touches real Google Cloud.
      - name: Integration tests (database drivers via Testcontainers)
        if: steps.docker.outputs.available == 'true'
        run: pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung test must fail fast, not run for the 6 h default
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build

  # Dependency, secret and image scanning. High severity findings fail the build.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung test must fail fast, not run for the 6 h default
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (Python dependencies)
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install -q --upgrade pip
          /tmp/audit-venv/bin/pip install -q ./backend pip-audit
          /tmp/audit-venv/bin/pip-audit --local --progress-spinner off --skip-editable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: yarn npm audit (frontend dependencies)
        working-directory: frontend
        run: yarn npm audit --all --recursive --severity high
      - name: gitleaks (secrets in the repository history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [backend, frontend]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dbbm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Client tools are installed
        run: docker run --rm --entrypoint sh dbbm:ci -c 'mysqldump --version && pg_dump --version && mongodump --version && mongorestore --version && rclone version'
      # rclone must run as the app user on a read-only root filesystem (config and cache in /tmp).
      - name: rclone runs read-only
        run: docker run --rm --read-only --tmpfs /tmp --user 10001:10001 --entrypoint rclone dbbm:ci version
      # The Go tools (built from source) must run as the app user on a read-only root filesystem.
      - name: Go tools run read-only
        run: docker run --rm --read-only --tmpfs /tmp --user 10001:10001 --entrypoint sh dbbm:ci -c 'mongodump --version && mongorestore --version && age --version && age-keygen --version'
      - name: Time zone data is available
        run: |
          docker run --rm --entrypoint python dbbm:ci -c \
            "from zoneinfo import ZoneInfo; ZoneInfo('Europe/Berlin'); ZoneInfo('America/New_York')"
      # The app starts read-only, owns the scheduler and reports it in /healthz.
      - name: Scheduler is healthy in the image
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp \
            --tmpfs /data:uid=10001,gid=10001 --tmpfs /backups:uid=10001,gid=10001 \
            -e APP_SECRET_KEY=ci-only-master-key-0123456789-abcdefgh -p 127.0.0.1:18080:8080 dbbm:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/healthz > /tmp/health.json && break; sleep 2; done
          cat /tmp/health.json
          grep -q '"state": *"running"' /tmp/health.json
          docker rm -f smoke
      # Backup and restore round trips against real servers, using the client tools in the image.
      - name: Integration tests inside the image
        run: |
          docker run --rm --user root --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/backend:/src:ro" \
            --entrypoint sh dbbm:ci -c \
            'mkdir /tmp/backend && tar -C /src --exclude=.venv --exclude=__pycache__ -cf - . | tar -C /tmp/backend -xf - \
            && cd /tmp/backend && curl -fsSL https://bootstrap.pypa.io/get-pip.py | python - -q && pip install -q ".[dev]" && pytest -m integration'
      - name: Image size
        run: |
          size="$(docker image inspect dbbm:ci --format '{{.Size}}')"
          echo "Image size: $((size / 1000000)) MB"
      # Scan the built image for known vulnerabilities in OS packages and Python libraries.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dbbm:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Publishes the image once every job above has passed. Pushes to main only (and a manual run on
  # main); pull requests never publish.
  #
  # Every green push updates the `edge` and `sha-<commit>` tags. The version is calculated, never
  # typed: scripts/release.py reads the Conventional Commits made since the latest stable vX.Y.Z tag
  # (a breaking change is a major, `feat` a minor, anything else a patch) and refuses instead of
  # guessing. When there is something to release, the job writes the version into the files that
  # carry it and rotates CHANGELOG.md, builds and smoke-tests the image, pushes it, then commits
  # `chore(release): vX.Y.Z`, tags it and creates the GitHub release. The commit and tag are pushed
  # with the workflow token, which does not start another workflow run.
  #
  # With no stable tag yet nothing is released automatically: run this workflow by hand on main
  # with an explicit `version` (for example 1.0.0) to start. After that every release is automatic.
  #
  # One-time setup (repository Settings > Secrets and variables > Actions):
  #   variable DOCKERHUB_USERNAME  Docker Hub user or organisation that owns the repository
  #   secret   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
  release:
    needs: [backend, frontend, security, docker]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      packages: write # push to ghcr.io
      id-token: write # keyless image signing
      attestations: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/dbbm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit log and the tags decide the version
          fetch-tags: true

      - name: Docker Hub is configured
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${{ vars.DOCKERHUB_USERNAME }}" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set the DOCKERHUB_USERNAME variable and the DOCKERHUB_TOKEN secret" >&2; exit 1
          fi

      # A release commit is pushed to main, so only the newest commit may release. If main has
      # moved on, the run for the newer commit publishes everything this one would have.
      - name: Is this still the tip of main
        id: tip
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on since this run started; the newer run will publish."
          fi

      - name: Work out the version
        id: version
        if: steps.tip.outputs.current == 'true'
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set +e
          version="$(python3 scripts/release.py next --version "$INPUT_VERSION" --bump "${INPUT_BUMP:-auto}")"
          code=$?
          set -e
          case "$code" in
            0)
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              echo "Releasing v${version}"
              ;;
            10)
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "::notice::No release this time; only the edge and sha tags are updated."
              ;;
            *)
              exit "$code"
              ;;
          esac

      - name: Write the version into the files and the changelog
        if: steps.version.outputs.release == 'true'
        run: python3 scripts/release.py apply "${{ steps.version.outputs.version }}"

      - name: Work out the image tags
        id: tags
        if: steps.tip.outputs.current == 'true'
        env:
          RELEASE: ${{ steps.version.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          short="${GITHUB_SHA::7}"
          {
            echo "tags<<TAGS_END"
            for image in "${GHCR_IMAGE,,}" "${DOCKERHUB_IMAGE,,}"; do
              echo "${image}:edge"
              echo "${image}:sha-${short}"
              if [ "$RELEASE" = true ]; then
                echo "${image}:${VERSION}"
                echo "${image}:${VERSION%.*}"
                echo "${image}:latest"
              fi
            done
            echo "TAGS_END"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.tip.outputs.current == 'true'
      - uses: docker/login-action@v4
        if: steps.tip.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: steps.tip.outputs.current == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and test the image that carries the new version before anything is published.
      - name: Build the release image for a smoke test
        if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: dbbm:release
          cache-from: type=gha
      - name: Smoke test the release image
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reported="$(docker run --rm --entrypoint python dbbm:release -c 'from app.version import __version__; print(__version__)')"
          if [ "$reported" != "$VERSION" ]; then
            echo "The image reports version ${reported}, expected ${VERSION}" >&2; exit 1
          fi
          docker run --rm --entrypoint python dbbm:release -c 'import pathlib; assert pathlib.Path("/app/frontend/dist/index.html").is_file()'

      # The image is pushed before the release commit and tag, so a failed push leaves nothing to
      # clean up in git: re-running the job calculates the same version again.
      - id: build
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64 # MySQL's apt repository has no arm64 packages for Debian
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=DBBM
            org.opencontainers.image.description=Self-hosted backups for MySQL, PostgreSQL, MongoDB and Firestore to local disk and Google Drive
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version || 'edge' }}
            org.opencontainers.image.licenses=MIT
          sbom: true # SBOM attached to the image
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v4.1.3
        if: steps.tip.outputs.current == 'true'
      - name: Sign the image (keyless)
        if: steps.tip.outputs.current == 'true'
        run: |
          cosign sign --yes "${GHCR_IMAGE,,}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "${DOCKERHUB_IMAGE,,}@${{ steps.build.outputs.digest }}"

      # Atomic: if main moved in the meantime, neither the commit nor the tag is pushed.
      - name: Commit and tag the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/version.py backend/pyproject.toml frontend/package.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"

      - name: GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            python3 scripts/release.py notes "$VERSION"
            echo
            echo "## Docker image"
            echo
            echo '```'
            echo "docker pull ${DOCKERHUB_IMAGE,,}:${VERSION}"
            echo "docker pull ${GHCR_IMAGE,,}:${VERSION}"
            echo '```'
          } > /tmp/notes.md
          gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file /tmp/notes.md --generate-notes

      # The page on hub.docker.com shows docs/DOCKERHUB.md. Editing it needs a token with enough
      # rights; if the token cannot, the image is already published, so this only warns.
      - name: Docker Hub description
        if: steps.tip.outputs.current == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/dbbm
          short-description: Self-hosted backups for MySQL, PostgreSQL, MongoDB and Firestore to local disk and Google Drive.
          readme-filepath: docs/DOCKERHUB.md

  # The landing page in site/ on GitHub Pages, https://lokixed.github.io/dbbm/. A repository admin
  # must switch it on once (Settings > Pages > Source: "GitHub Actions"). Until then this job fails
  # without failing the run.
  pages:
    needs: [backend, frontend, security, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write # publish the site
      id-token: write # lets deploy-pages verify the deployment is from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
